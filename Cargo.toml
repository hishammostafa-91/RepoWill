# SPDX-License-Identifier: AGPL-3.0-or-later
[workspace]
resolver = "3"
members = [
    "crates/repowill-model",
    "crates/repowill-core",
    "crates/repowill-cli",
    "crates/repowill-testkit",
    "xtask",
    "apps/gui/src-tauri",
]
default-members = [
    "crates/repowill-model",
    "crates/repowill-core",
    "crates/repowill-cli",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
license = "AGPL-3.0-or-later"
authors = ["AfterLeads <afterleadseg@gmail.com>"]

[workspace.dependencies]
# Internal crates
repowill-model = { path = "crates/repowill-model", version = "0.1.0" }
repowill-core = { path = "crates/repowill-core", version = "0.1.0" }
repowill-testkit = { path = "crates/repowill-testkit", version = "0.1.0" }

# External (versions pinned in VERSIONS.md)
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
anyhow = "=1.0.104"
clap = { version = "=4.6.7", features = ["derive"] }
clap_complete = "=4.6.11"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
camino = "=1.2.6"
directories = "=6.0.0"
dunce = "=1.0.5"
fd-lock = "=4.0.4"
process-wrap = "=10.0.1"
which = "=8.0.6"
trash = "=5.2.9"
keyring = "=4.2.0"
tracing-appender = "=0.2.5"
tempfile = "=3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"